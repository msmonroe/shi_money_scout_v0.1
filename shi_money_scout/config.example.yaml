search:
  max_results_per_query: 8
  queries:
    - '"Power BI" remote contract'
    - '"SSRS" remote contract'
    - '"SQL reporting" remote contract'
    - '"Entra ID" SSO contract remote'
    - '"Azure AD" SSO contractor'
    - '".NET" contract remote'
    - '"AI automation" consultant remote'
    - '"automation consultant" subcontractor'
    - '"Power BI" RFP Oregon'
    - '"business intelligence" RFP Oregon'
    - '"Microsoft partner" subcontractor Power BI'
    - '"MSP" subcontractor .NET Oregon'
    - '"AI infrastructure" consultant remote'
    - '"HPC" research software engineer Oregon'
    - '"HPC" research software engineer California'
    - '"GPU infrastructure" engineer remote'
    - '"private AI" consultant on-prem LLM'
    - '"LLM fine tuning" consultant contract'
    - '"LoRA" OR "QLoRA" consultant contract'
    - '"RAG" consultant contract remote'
    - '"model evaluation" LLM consultant'

profile:
  skills:
    - Power BI
    - SSRS
    - SQL Server
    - Crystal Reports
    - C#
    - .NET
    - ASP.NET
    - Azure
    - Microsoft Entra ID
    - SAML
    - OAuth2
    - OpenID Connect
    - REST APIs
    - business analysis
    - AI automation
    - Python
    - Docker
    - Linux
    - Ollama
    - local LLMs
    - model evaluation
  preferred:
    remote: true
    contract_or_1099: true
    oregon_public_sector: true
    california: true
    subcontracting: true
    ai_infrastructure: true
    research_software: true
  avoid:
    - commission-only
    - unpaid trial
    - MLM
    - crypto trading
    - gambling

scoring:
  weights:
    buyer_intent: 2.0
    revenue_potential: 1.5
    skill_fit: 2.0
    visible_pain: 1.2
    urgency: 1.2
    decision_maker_access: 0.8
    time_to_first_dollar: 1.6
    acquisition_friction: 1.5
    competition: 0.7
    reality_confidence: 2.0

  minimum_score_to_surface: 62

models:
  enabled: true
  ollama_url: "http://localhost:11434"
  reviewers:
    # Replace these with models you actually have installed.
    - "qwen3:14b"
    - "deepseek-r1:14b"
  timeout_seconds: 90
  consensus:
    # median | mean | trimmed_mean
    strategy: median
    min_reviewers: 2
    use_model_weights: false
    model_weights:
      qwen3:14b: 1.0
      deepseek-r1:14b: 1.0
    trim_ratio: 0.2
    disagreement_penalty:
      enabled: true
      stddev_threshold: 2.0
      max_penalty_points: 10
    evidence_penalty:
      enabled: true
      # Reviewers must quote page text verbatim. Poor quote verification reduces the score.
      min_verification_ratio: 0.6
      max_penalty_points: 8
    auto_calibration:
      enabled: false
      history_file: "output/opportunities.json"
      # This remains a provisional baseline. Prefer real outcome data before enabling
      # calibration aggressively.
      target: "deterministic_scores"
      min_samples_per_model: 8
      min_weight: 0.6
      max_weight: 1.6
      smooth_to: 1.0
      alpha: 0.5
      apply_to_runtime: true
      write_suggestions_file: "output/model_weights.suggested.json"

safety:
  never_contact_people: true
  never_apply_automatically: true
  never_spend_money: true
  never_create_accounts: true
